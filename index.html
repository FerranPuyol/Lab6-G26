<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App d'Enquestes</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; }
    select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const initialSurveys = [
  {
    id: 1,
    title: "Satisfacció del curs",
    questions: [
      { id: 1, text: "Com valores el contingut?", options: ["Molt bo", "Bo", "Regular", "Dolent"] },
      { id: 2, text: "Recomanaries el curs?", options: ["Sí", "Potser", "No"] }
    ],
    responses: []
  }
];

function App() {
  const [view, setView] = useState("list");
  const [role, setRole] = useState("admin");
  const [surveys, setSurveys] = useState(initialSurveys);

  return (
    <div className="container">
      <header>
        <h1>App d'Enquestes</h1>
        <div>
          <label>Rol: </label>
          <select value={role} onChange={e => setRole(e.target.value)}>
            <option value="admin">Administrador</option>
            <option value="user">Usuari</option>
          </select>
        </div>
      </header>
      <main>
        <p style={{color: "#999"}}>Vista: {view}</p>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
